<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0E1A">
  <title>IRON COLLECTION — TCG Westeros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.jpg">
  <link rel="stylesheet" href="style.css">
  <!-- Client SDK Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  
  <header class="topbar">
    <a class="brand" href="#accueil" aria-label="Iron Collection, accueil">
      <img class="brand-logo" src="images/logo.jpg" alt="">
      <span>IRON<br><b>COLLECTION</b></span>
    </a>
    <nav id="mainNav" class="main-nav" aria-label="Navigation principale">
      <a href="#accueil" data-view="accueil">Accueil</a>
      <a href="#booster" data-view="booster">Booster</a>
      <a href="#collection" data-view="collection">Ma collection</a>
      <a href="#profil" data-view="profil">Profil</a>
    </nav>
    <div class="top-actions">
      <button id="soundBtn" class="icon-btn" aria-label="Activer ou couper le son">◖</button>
      <button id="authBtn" class="cta secondary" style="margin:0; padding:6px 14px; font-size:16px;">Connexion</button>
      <a class="profile-chip" href="#profil">
        <span class="avatar-mini">♜</span>
        <span class="level" id="userDisplay">INVITÉ</span>
      </a>
      <button id="menuToggle" class="menu-toggle" aria-label="Ouvrir le menu">☰</button>
    </div>
  </header>

  <main id="app" class="app-shell"></main>

  <footer class="footer">
    <span>IRON COLLECTION · ARCHIVES DE WESTEROS</span>
    <span>SAISON I · LE TRÔNE EST À VOUS</span>
  </footer>

  <!-- Modal pour les cartes -->
  <div id="cardModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Détail de la carte">
      <button class="modal-close" data-close-modal aria-label="Fermer">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Modal d'authentification (Connexion / Inscription) -->
  <div id="authModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="closeAuthModal"></div>
    <div class="modal-card" style="max-width:400px;">
      <button class="modal-close" id="closeAuthModalBtn">×</button>
      <div class="auth-form-container">
        <h2 id="authTitle" style="margin-bottom:15px;">Se connecter</h2>
        <form id="authForm" style="display:flex; flex-direction:column; gap:12px;">
          <input type="email" id="authEmail" class="input" placeholder="Adresse Email" required>
          <input type="password" id="authPassword" class="input" placeholder="Mot de passe" required>
          <button type="submit" id="authSubmitBtn" class="cta">Se connecter</button>
        </form>
        <p style="margin-top:15px; font-size:14px; cursor:pointer; text-decoration:underline;" id="toggleAuthMode">
          Pas encore de compte ? S'inscrire
        </p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
